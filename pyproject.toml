[project]
name = "xliff-safe-edit"
version = "1.0.0"
description = "Edit an XLIFF delivery in a browser without re-serialising the file"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jakub Kozub" }]
keywords = ["xliff", "translation", "localization", "localisation", "l10n", "cat-tool"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = []

[project.scripts]
xliff-safe-edit = "xliffedit.server:main"

[project.urls]
Homepage = "https://github.com/kubakozub/xliff-safe-edit"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xliffedit"]

[tool.setuptools.package-data]
xliffedit = ["ui.html", "ui.js", "ui.css"]
